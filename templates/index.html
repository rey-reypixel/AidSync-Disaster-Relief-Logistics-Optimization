<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disaster Management Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: #f5f7fa;
    }

    .header {
      background: linear-gradient(90deg, #007bff, #00c6ff);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 4px solid #0056b3;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .form-label {
      font-weight: 500;
    }

    .btn {
      font-weight: 600;
    }

    #result, #heatmap-result {
      white-space: pre-line;
      background: #fdfdfd;
      border-left: 4px solid #007bff;
      padding: 1rem;
      border-radius: 8px;
    }

    .section-icon {
      font-size: 1.5rem;
      margin-right: 0.5rem;
    }

    #heatmap-img {
      max-height: 500px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 class="fw-bold">Disaster Management Dashboard</h1>
    <p class="mb-0">Visualize disaster urgency & plan relief paths intelligently</p>
  </div>

  <div class="container">

    <!-- Heatmap Section -->
    <div class="card mb-5 p-4">
      <h4 class="mb-4 text-primary"><span class="section-icon">📊</span>Disaster Heatmap Generator</h4>
      
      <div class="row g-3">
        <div class="col-md-6">
          <label for="heatmap-district" class="form-label">District</label>
          <select id="heatmap-district" class="form-select">
            <option value="">-- Select District --</option>
            {% for district in districts %}
              <option value="{{ district }}">{{ district }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="disaster" class="form-label">Disaster Type</label>
          <select id="disaster" class="form-select">
            <option value="">-- Select Disaster --</option>
            {% for d in disasters %}
              <option value="{{ d }}">{{ d.capitalize() }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mt-4 d-grid">
        <button class="btn btn-outline-primary btn-lg" onclick="generateHeatmap()">Generate Heatmap</button>
      </div>

      <div class="mt-4" id="heatmap-result"></div>
      <img id="heatmap-img" class="img-fluid rounded mt-3 d-none" />
    </div>

    <!-- Dijkstra Pathfinding Section -->
    <div class="card p-4">
      <h4 class="mb-4 text-danger"><span class="section-icon">🚑</span>Nearest Relief Center Finder (Dijkstra)</h4>
      
      <div class="row g-3">
        <div class="col-md-6">
          <label for="district" class="form-label">District</label>
          <select id="district" class="form-select">
            <option value="">-- Select District --</option>
            {% for district in districts %}
              <option value="{{ district }}">{{ district }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <select id="city" class="form-select">
            <option value="">-- Select a District First --</option>
          </select>
        </div>
      </div>

      <div class="mt-4 d-grid">
        <button class="btn btn-danger btn-lg" onclick="runDijkstra()">Find Nearest Relief Center</button>
      </div>

      <div class="mt-4" id="result"></div>
    </div>

    <footer class="text-center mt-5 text-muted small">
      Made with ❤️ for disaster preparedness
    </footer>
  </div>

  <!-- Scripts -->
  <script>
    const districtCities = JSON.parse(`{{ district_cities | safe }}`);

    document.getElementById('district').addEventListener('change', function () {
      const selectedDistrict = this.value;
      const citySelect = document.getElementById('city');
      citySelect.innerHTML = '';

      if (districtCities[selectedDistrict]) {
        districtCities[selectedDistrict].forEach(cityData => {
          const city = cityData[0];
          const option = document.createElement('option');
          option.value = city;
          option.textContent = city;
          citySelect.appendChild(option);
        });
      }
    });

    function runDijkstra() {
      const city = document.getElementById('city').value;
      if (!city) {
        alert("Please select a city first.");
        return;
      }

      fetch('/find_path', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ city })
      })
        .then(res => res.json())
        .then(data => {
          const resultDiv = document.getElementById('result');
          if (data.success) {
            resultDiv.innerHTML =
              `✅ Nearest Relief Center: <strong>${data.relief_center}</strong><br>` +
              `📏 Distance: <strong>${data.distance_km.toFixed(2)} km</strong><br>` +
              `🗺️ Map File: <code>${data.map_file}</code> (opened in browser)`;
          } else {
            resultDiv.innerHTML = `<span class="text-danger">❌ ${data.error}</span>`;
          }
        })
        .catch(err => {
          console.error("Fetch error:", err);
          alert("Something went wrong.");
        });
    }

    function generateHeatmap() {
      const district = document.getElementById('heatmap-district').value;
      const disaster = document.getElementById('disaster').value;

      if (!district || !disaster) {
        alert("Please select both district and disaster.");
        return;
      }

      fetch('/generate_heatmap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ district, disaster })
      })
        .then(response => response.json())
        .then(data => {
          const img = document.getElementById('heatmap-img');
          const resultDiv = document.getElementById('heatmap-result');

          if (data.success) {
            img.src = `data:image/png;base64,${data.plot_url}`;
            img.classList.remove('d-none');
            resultDiv.textContent = data.city_info;
          } else {
            img.classList.add('d-none');
            resultDiv.innerHTML = `<span class="text-danger">❌ ${data.error}</span>`;
          }
        });
    }
  </script>

</body>
</html>
